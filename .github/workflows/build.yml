name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: universal

      - name: Test
        run: cargo test

      - name: Build universal Reaview.app
        run: UNIVERSAL=1 ./scripts/bundle.sh

      - name: Verify architectures
        run: |
          lipo -archs target/Reaview.app/Contents/MacOS/Reaview
          codesign --verify --strict --verbose=2 target/Reaview.app

      - name: Zip app
        run: ditto -c -k --keepParent target/Reaview.app Reaview-universal.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Reaview-universal
          path: Reaview-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Reaview-universal
      - uses: softprops/action-gh-release@v2
        with:
          files: Reaview-universal.zip
          generate_release_notes: true
