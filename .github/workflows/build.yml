name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: universal

      - name: Test
        run: cargo test

      - name: Build universal Reaview.app
        run: UNIVERSAL=1 ./scripts/bundle.sh

      - name: Verify architectures
        run: |
          lipo -archs target/Reaview.app/Contents/MacOS/Reaview
          codesign --verify --strict --verbose=2 target/Reaview.app

      - name: Zip app
        run: ditto -c -k --keepParent target/Reaview.app Reaview-universal.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Reaview-universal
          path: Reaview-universal.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Reaview-universal
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: Reaview-universal.zip
          generate_release_notes: true
